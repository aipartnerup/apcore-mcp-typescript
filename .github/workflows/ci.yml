name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # The fixtures directory itself, not the checkout root — see
      # tests/conformance-fixtures.ts for how this is resolved.
      APCORE_CONFORMANCE_FIXTURES: ${{ github.workspace }}/apcore-mcp/conformance/fixtures
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check out conformance fixtures
        uses: actions/checkout@v4
        with:
          repository: aiperceivable/apcore-mcp
          path: apcore-mcp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run tests
        run: pnpm test
